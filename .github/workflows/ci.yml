name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @webamboos/jsx-slack build

      - run: pnpm -r test

      - run: pnpm --filter demo check
